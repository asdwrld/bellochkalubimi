<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Твоё настроение</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            background: linear-gradient(135deg, #171020, #352044, #171020);
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            font-size: 30px;
            margin-bottom: 12px;
        }

        p {
            color: #ddd3e8;
            line-height: 1.6;
        }

        .ratings {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin: 25px 0;
        }

        button {
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
        }

        .rating-button {
            padding: 15px 5px;
            border-radius: 12px;
            color: white;
            background: #69458a;
        }

        button:hover {
            transform: scale(1.05);
            filter: brightness(1.15);
        }

        .main-button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border-radius: 12px;
            color: white;
            background: linear-gradient(135deg, #a46bd4, #7544a5);
        }

        input {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: 1px solid #76578f;
            border-radius: 12px;
            outline: none;
            color: white;
            background: rgba(0, 0, 0, 0.25);
            font-size: 16px;
        }

        input::placeholder {
            color: #bdb0c9;
        }

        .hidden {
            display: none;
        }

        .message {
            margin-top: 20px;
            padding: 18px;
            border-radius: 14px;
            background: rgba(164, 107, 212, 0.15);
            line-height: 1.6;
        }

        .status {
            margin-top: 15px;
            font-size: 14px;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #a99ab8;
        }
    </style>
</head>

<body>
    <div class="container">
        <section id="ratingSection">
            <h1>Как твоё настроение? 💜</h1>
            <p>Выбери число от 1 до 10</p>

            <div class="ratings">
                <button class="rating-button" onclick="rate(1)">1</button>
                <button class="rating-button" onclick="rate(2)">2</button>
                <button class="rating-button" onclick="rate(3)">3</button>
                <button class="rating-button" onclick="rate(4)">4</button>
                <button class="rating-button" onclick="rate(5)">5</button>
                <button class="rating-button" onclick="rate(6)">6</button>
                <button class="rating-button" onclick="rate(7)">7</button>
                <button class="rating-button" onclick="rate(8)">8</button>
                <button class="rating-button" onclick="rate(9)">9</button>
                <button class="rating-button" onclick="rate(10)">10</button>
            </div>

            <div id="ratingMessage" class="message hidden"></div>
        </section>

        <section id="wordSection" class="hidden">
            <h1>Теперь твоя очередь ✨</h1>
            <p>Напиши любое слово, которое приходит тебе в голову</p>
<input
                type="text"
                id="word"
                maxlength="200"
                placeholder="Твоё слово..."
                autocomplete="off"
            >

            <button class="main-button" id="sendButton" onclick="finish()">
                Отправить 💌
            </button>

            <div id="status" class="status"></div>
        </section>

        <section id="finalSection" class="hidden">
            <h1>Спасибо! 💜</h1>
            <p id="finalMessage"></p>
            <p>Пусть у тебя всё будет хорошо ✨</p>
        </section>

        <div class="footer">Сделано с заботой 💜</div>
    </div>

    <script>
        const email = "upon.holl@gmail.com";

        const messages = {
            1: "Мне жаль, что тебе сейчас нелегко. Пожалуйста, не забывай заботиться о себе. 💜",
            2: "Даже если день не задался, впереди ещё много хороших моментов.",
            3: "Бывает сложно, но ты не обязан справляться со всем сразу. 🌙",
            4: "Надеюсь, скоро тебе станет немного лучше. Береги себя!",
            5: "Пусть остаток дня принесёт тебе что-нибудь приятное. ✨",
            6: "Уже неплохо! Желаю тебе побольше хороших моментов.",
            7: "Здорово! Надеюсь, день продолжит радовать тебя. 💜",
            8: "Отличное настроение! Пусть так будет как можно дольше!",
            9: "Замечательно! Желаю тебе ещё больше поводов улыбаться. 🌟",
            10: "Вау, десять из десяти! Пусть каждый день приносит радость! 💖"
        };

        function rate(number) {
            document.getElementById("ratingMessage").textContent =
                messages[number];

            document.getElementById("ratingMessage").classList.remove("hidden");

            document.getElementById("wordSection").classList.remove("hidden");

            document.getElementById("wordSection").scrollIntoView({
                behavior: "smooth",
                block: "center"
            });
        }

        async function finish() {
            const wordInput = document.getElementById("word");
            const status = document.getElementById("status");
            const sendButton = document.getElementById("sendButton");

            const word = wordInput.value.trim();

            if (!word) {
                status.textContent = "Сначала напиши слово 💜";
                return;
            }

            sendButton.disabled = true;
            sendButton.textContent = "Отправляем...";
            status.textContent = "Пожалуйста, подожди...";

            try {
                const response = await fetch(
                    "https://formsubmit.co/ajax/" + email,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        },
                        body: JSON.stringify({
                            _subject: "Новое слово с сайта",
                            word: word,
                            _captcha: "true"
                        })
                    }
                );

                const result = await response.json();

                if (response.ok && result.success) {
                    document.getElementById("finalMessage").textContent =
                        "Ты написал: «" + word + "». Спасибо, что поделился своим словом! 💜";

                    document.getElementById("wordSection").classList.add("hidden");
                    document.getElementById("ratingSection").classList.add("hidden");
                    document.getElementById("finalSection").classList.remove("hidden");
                } else {
                    throw new Error("Не удалось отправить сообщение");
                }
            } catch (error) {
                status.textContent =
                    "Не получилось отправить. Попробуй ещё раз немного позже.";
sendButton.disabled = false;
                sendButton.textContent = "Отправить 💌";
            }
        }
    </script>
</body>
</html>
