<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Твоё настроение 💜</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            background: linear-gradient(135deg, #171020, #352044, #171020);
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        p {
            color: #ddd3e8;
            line-height: 1.6;
        }

        .ratings {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin: 25px 0;
        }

        button {
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.04);
            filter: brightness(1.15);
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        .rating-button {
            padding: 15px 5px;
            border-radius: 12px;
            color: white;
            background: #69458a;
        }

        .main-button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border-radius: 12px;
            color: white;
            background: linear-gradient(135deg, #a46bd4, #7544a5);
        }

        .secondary-button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border-radius: 12px;
            color: white;
            background: #4b365e;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: 1px solid #76578f;
            border-radius: 12px;
            outline: none;
            color: white;
            background: rgba(0, 0, 0, 0.25);
            font-size: 16px;
        }

        input::placeholder {
            color: #bdb0c9;
        }

        .hidden {
            display: none !important;
        }

        .message {
            margin-top: 20px;
            padding: 18px;
            border-radius: 14px;
            background: rgba(164, 107, 212, 0.15);
            line-height: 1.6;
        }

        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #ddd3e8;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #a99ab8;
        }

        .window {
            animation: appear 0.25s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- ОКНО 1: ВЫБОР НАСТРОЕНИЯ -->
        <section id="ratingSection" class="window">
            <h1>Как твоё настроение? 💜</h1>
            <p>Выбери число от 1 до 10</p>

            <div class="ratings">
                <button class="rating-button" onclick="rate(1)">1</button>
<button class="rating-button" onclick="rate(2)">2</button>
                <button class="rating-button" onclick="rate(3)">3</button>
                <button class="rating-button" onclick="rate(4)">4</button>
                <button class="rating-button" onclick="rate(5)">5</button>
                <button class="rating-button" onclick="rate(6)">6</button>
                <button class="rating-button" onclick="rate(7)">7</button>
                <button class="rating-button" onclick="rate(8)">8</button>
                <button class="rating-button" onclick="rate(9)">9</button>
                <button class="rating-button" onclick="rate(10)">10</button>
            </div>
        </section>

        <!-- ОКНО 2: СООБЩЕНИЕ ПОСЛЕ ВЫБОРА ЦИФРЫ -->
        <section id="messageSection" class="hidden window">
            <h1>Твоё сообщение 💜</h1>
            <div id="ratingMessage" class="message"></div>

            <button class="main-button" onclick="nextStep()">
                Далее →
            </button>

            <button class="secondary-button" onclick="backToRating()">
                Назад
            </button>
        </section>

        <!-- ОКНО 3: ВВОД СЛОВА -->
        <section id="wordSection" class="hidden window">
            <h1>Теперь твоя очередь ✨</h1>
            <p>Напиши любое слово, которое приходит тебе в голову</p>

            <input
                type="text"
                id="word"
                maxlength="200"
                placeholder="Твоё слово..."
                autocomplete="off"
            >

            <button
                class="main-button"
                id="sendButton"
                onclick="finish()"
            >
                Отправить 💌
            </button>

            <button class="secondary-button" onclick="backToMessage()">
                Назад
            </button>

            <div id="status" class="status"></div>
        </section>

        <!-- ОКНО 4: ЗАВЕРШЕНИЕ -->
        <section id="finalSection" class="hidden window">
            <h1>Спасибо! 💜</h1>
            <p id="finalMessage"></p>
            <p>Пусть у тебя всё будет хорошо ✨</p>
        </section>

        <div class="footer">Сделано с заботой 💜</div>
    </div>

    <script>
        const email = "upon.holl@gmail.com";

        // Твои оригинальные сообщения сохранены
        const messages = {
            1: "Ну не грусти. Если захочешь, напиши мне — я выслушаю ❤️",
            2: "Уже лучше, но если что-то тревожит, можешь мне рассказать 💜",
            3: "Ну это вообще ни рыба ни мясо. Давай не кисни!",
            4: "Симпл тоже когда-то был бездарем. Но этот парень с тобой рядом не стоял — ты прекрасна!",
            5: "Ну более-менее! Может, пора в Дискорд, всё обсудим и решим 😊",
            6: "Ну что-то уже получается! Пойдём в Faceit, я какую-нибудь хуйню вкину — и кайф 😂",
            7: "Ну ты типа Монеси! Донк и остальные вообще раки, а ты умничка 💜",
            8: "Ты вообще ракета, бомба, петарда! Давай в том же духе 🚀",
            9: "Просто красотка! Но это не десяточка. Скажи мальчику, чего тебе не хватило 😉",
            10: "Умничка, красотка, легенда! Ты сияешь как никогда! ✨"
        };

        let selectedRating = 0;

        function showSection(sectionId) {
            const sections = [
                "ratingSection",
                "messageSection",
                "wordSection",
                "finalSection"
            ];

            sections.forEach(id => {
                document.getElementById(id).classList.add("hidden");
            });

            document.getElementById(sectionId).classList.remove("hidden");

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }

        // Выбор настроения
        function rate(number) {
            selectedRating = number;

            document.getElementById("ratingMessage").textContent =
                messages[number];

            showSection("messageSection");
        }
// Переход к вводу слова
        function nextStep() {
            showSection("wordSection");
            document.getElementById("word").focus();
        }

        // Возврат к выбору настроения
        function backToRating() {
            showSection("ratingSection");
        }

        // Возврат к сообщению
        function backToMessage() {
            showSection("messageSection");
        }

        // Отправка слова на почту
        async function finish() {
            const wordInput = document.getElementById("word");
            const status = document.getElementById("status");
            const sendButton = document.getElementById("sendButton");

            const word = wordInput.value.trim();

            if (!word) {
                status.textContent = "Сначала напиши слово 💜";
                return;
            }

            sendButton.disabled = true;
            sendButton.textContent = "Отправляем...";
            status.textContent = "Пожалуйста, подожди...";

            try {
                const response = await fetch(
                    "https://formsubmit.co/ajax/" + email,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        },
                        body: JSON.stringify({
                            _subject: "Новое слово с сайта Bellochka",
                            word: word,
                            mood_rating: selectedRating,
                            _captcha: "true"
                        })
                    }
                );

                const result = await response.json();

                if (response.ok && result.success) {
                    document.getElementById("finalMessage").textContent =
                        "Ты написал: «" + word +
                        "». Спасибо, что поделился своим словом! 💜";

                    showSection("finalSection");
                } else {
                    throw new Error("Не удалось отправить сообщение");
                }
            } catch (error) {
                status.textContent =
                    "Не получилось отправить. Попробуй ещё раз немного позже.";

                sendButton.disabled = false;
                sendButton.textContent = "Отправить 💌";
            }
        }
    </script>
</body>
</html>
