
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Маленький сюрприз 💙</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #bde9ff, #78bfff, #d9f4ff);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    color: #174b78;
}

.screen {
    text-align: center;
    padding: 25px;
    width: 100%;
    max-width: 600px;
    animation: appear 1s ease;
}

.hidden {
    display: none;
}

h1 {
    font-size: 30px;
    margin-bottom: 25px;
}

p {
    font-size: 20px;
    margin: 15px 0;
}

#bow {
    font-size: 120px;
    cursor: pointer;
    transition: transform 0.3s;
    display: inline-block;
}

#bow:hover {
    transform: scale(1.1);
}

.arrow {
    font-size: 65px;
    position: absolute;
    top: 45%;
    left: -100px;
    transform: rotate(-10deg);
    display: none;
    z-index: 5;
}

.fly {
    display: block;
    animation: fly 1.5s ease-in forwards;
}

@keyframes fly {
    0% {
        left: -100px;
    }
    100% {
        left: 75%;
    }
}

.heart {
    font-size: 100px;
    animation: heartbeat 1s infinite;
    margin: 20px;
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
}

button {
    padding: 14px 35px;
    margin: 15px;
    border: none;
    border-radius: 30px;
    background: #278bd1;
    color: white;
    font-size: 20px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 5px 15px #428fc766;
}

button:hover {
    transform: scale(1.08);
    background: #126bb0;
}

.no {
    background: #7c9db7;
}

.ring {
    font-size: 120px;
    margin: 20px;
    animation: heartbeat 1.5s infinite;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.hearts {
    position: fixed;
    pointer-events: none;
    font-size: 25px;
    animation: rise 4s linear forwards;
}

@keyframes rise {
    from {
        transform: translateY(0);
        opacity: 1;
    }
    to {
        transform: translateY(-100vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<!-- Первый экран -->
<div class="screen" id="firstScreen">
    <h1>Для тебя есть кое-что особенное 💙</h1>
    <p>Нажми на лук, чтобы узнать...</p>

    <div id="bow" onclick="shoot()">🏹</div>

    <p>Жми сюда 💌</p>
</div>

<div class="arrow" id="arrow">➳</div>

<!-- Второй экран -->
<div class="screen hidden" id="questionScreen">
    <div class="heart">💙</div>

    <h1>Готова ли ты со мной встречаться?</h1>

    <button onclick="sayYes()">Да ❤️</button>
    <button class="no" onclick="sayNo()">Нет</button>

    <p id="answer"></p>
</div>

<!-- Финальный экран -->
<div class="screen hidden" id="finalScreen">
    <div class="ring">💍</div>

    <h1>УРААА! 💙</h1>

    <p>Ты сделала меня самым счастливым человеком!</p>
    <p>Я очень рад, что ты сказала «Да» ❤️</p>
    <p>Пусть это будет началом нашей красивой истории!</p>

    <div class="heart">💙</div>
</div>

<script>
let clicked = false;

function shoot() {
    if (clicked) return;

    clicked = true;

    document.getElementById("bow").style.opacity = "0.4";

    let arrow = document.getElementById("arrow");
    arrow.classList.add("fly");

    setTimeout(() => {
        document.getElementById("firstScreen").classList.add("hidden");
        document.getElementById("questionScreen").classList.remove("hidden");
        arrow.classList.remove("fly");
        arrow.style.display = "none";
    }, 1600);
}

function sayYes() {
    document.getElementById("questionScreen").classList.add("hidden");
    document.getElementById("finalScreen").classList.remove("hidden");

    createHearts();
}

function sayNo() {
    document.getElementById("answer").textContent =
        "Ничего страшного 💙 Спасибо за честность!";
}

function createHearts() {
    setInterval(() => {
        let heart = document.createElement("div");
        heart.className = "hearts";
        heart.textContent = "💙";

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.bottom = "-30px";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 4000);
    }, 300);
}
</script>

</body>
</html>
